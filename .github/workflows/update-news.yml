name: Update news

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        default: "2"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_news.py
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '2' }}
      - name: Commit data
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "Update news" && git push)
      - name: Rebuild the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST /repos/${{ github.repository }}/pages/builds
